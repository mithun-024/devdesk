<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#12131a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="subtleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1f2335"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#2f3549" stroke-width="8"/>

  <!-- Subtle Top Window Bar Detail -->
  <line x1="64" y1="128" x2="448" y2="128" stroke="#24283b" stroke-width="4"/>
  <circle cx="96" cy="76" r="12" fill="#3b4261"/>
  <circle cx="132" cy="76" r="12" fill="#3b4261"/>
  <circle cx="168" cy="76" r="12" fill="#3b4261"/>

  <!-- Left Layer Panel -->
  <rect x="80" y="168" width="144" height="264" rx="16" fill="url(#subtleGrad)" stroke="#2e3440" stroke-width="4"/>
  <rect x="104" y="200" width="96" height="16" rx="6" fill="#3b4261"/>
  <rect x="104" y="232" width="72" height="12" rx="4" fill="#2e3440"/>
  <rect x="104" y="260" width="88" height="12" rx="4" fill="#2e3440"/>
  <rect x="104" y="288" width="64" height="12" rx="4" fill="#2e3440"/>

  <!-- Main Workstation Terminal Symbol -->
  <rect x="248" y="168" width="184" height="264" rx="16" fill="#16161e" stroke="#2f3549" stroke-width="4"/>

  <!-- Terminal Prompt > -->
  <path d="M 280 224 L 320 256 L 280 288" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor _ -->
  <line x1="336" y1="288" x2="384" y2="288" stroke="#7dcfff" stroke-width="10" stroke-linecap="round"/>

  <!-- Mini Port / Activity Dots -->
  <circle cx="280" cy="360" r="8" fill="#9ece6a"/>
  <rect x="304" y="356" width="64" height="8" rx="4" fill="#3b4261"/>

  <circle cx="280" cy="392" r="8" fill="#7aa2f7"/>
  <rect x="304" y="388" width="84" height="8" rx="4" fill="#3b4261"/>
</svg>
